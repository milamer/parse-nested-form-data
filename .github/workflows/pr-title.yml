name: pr-title
# PRs are squash-merged with the PR title as the commit message, so the title
# is what semantic-release reads. Uses the same commitlint config as the local
# commit-msg hook.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7

      - name: ⎔ Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: 📥 Download deps
        run: npm ci
        env:
          LEFTHOOK: 0

      - name: 📝 Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx commitlint --verbose

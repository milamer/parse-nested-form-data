name: validate
on:
  push:
    branches:
      - '+([0-9])?(.{+([0-9]),x}).x'
      - 'main'
      - 'next'
      - 'next-major'
      - 'beta'
      - 'alpha'
      - '!all-contributors/**'
  pull_request: {}

# cancel superseded runs of the same branch / PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  main:
    # ignore all-contributors PRs
    if: ${{ !contains(github.head_ref, 'all-contributors') }}
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # codecov OIDC upload
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7

      - name: ⎔ Setup node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: 📥 Download deps
        run: npm install
        env:
          LEFTHOOK: 0

      - name: ▶️ Run validate script
        run: npm run validate

      - name: ⬆️ Upload coverage report
        if: ${{ matrix.node == 24 }}
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: coverage/lcov.info

  release:
    needs: main
    runs-on: ubuntu-latest
    if:
      ${{ github.repository == 'milamer/parse-nested-form-data' &&
      contains('refs/heads/main,refs/heads/beta,refs/heads/next,refs/heads/alpha',
      github.ref) && github.event_name == 'push' }}
    permissions:
      contents: write # publish GitHub release
      issues: write # comment on released issues
      pull-requests: write # comment on released PRs
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v7

      - name: ⎔ Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 📥 Download deps
        run: npm install
        env:
          LEFTHOOK: 0

      - name: 🏗 Run build script
        run: npm run build

      - name: 🚀 Release
        uses: cycjimmy/semantic-release-action@v8
        with:
          semantic_version: 25
          branches: |
            [
              '+([0-9])?(.{+([0-9]),x}).x',
              'main',
              'next',
              'next-major',
              {name: 'beta', prerelease: true},
              {name: 'alpha', prerelease: true}
            ]
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

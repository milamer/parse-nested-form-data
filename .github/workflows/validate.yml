name: validate
on:
  push:
    # same branches as package.json#release
    branches:
      - 'main'
      # maintenance branches (1.x, 1.2.x); GitHub's filter syntax, not micromatch
      - '[0-9]+.x'
      - '[0-9]+.[0-9]+.x'
  pull_request: {}

# cancel superseded PR runs; let push runs finish so every commit gets a result
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  main:
    # ignore all-contributors PRs
    if: ${{ !contains(github.head_ref, 'all-contributors') }}
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # codecov OIDC upload
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⎔ Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Node 22 bundles npm 10, which lacks allowScripts / min-release-age and
      # fails devEngines. Corepack (bundled with 22) runs the npm pinned in
      # package.json#packageManager and verifies its sha512. Node 24/26 bundle
      # a new enough npm, so they skip this.
      - name: 📦 Use pinned npm
        if: ${{ matrix.node == 22 }}
        run: corepack enable npm && npm --version
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

      # no dependency (or root) lifecycle scripts in CI; nothing here needs them
      - name: 📥 Download deps
        run: npm ci --ignore-scripts

      - name: ▶️ Run validate script
        run: npm run validate

      - name: ⬆️ Upload coverage report
        if: ${{ matrix.node == 24 }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage/lcov.info

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔎 Lint GitHub workflows
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color
